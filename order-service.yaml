server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/restaurant
    username: root
    password: nilkamal
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      #show-sql: true
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

security:
  service-auth:
    shared-secret: ${SERVICE_AUTH_SECRET}
    allowed-services:
      - inventory-service

app:
  clients:
    catalog:
      base-url: http://localhost:8083

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/