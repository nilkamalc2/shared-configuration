server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/restaurant
    username: root
    password: nilkamal
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

security:
  service-auth:
    shared-secret: ${SERVICE_AUTH_SECRET}
    allowed-services:
      - order-service

app:
  clients:
    catalog:
      base-url: http://catalog-service:8083
    order:
      base-url: http://order-service:8085

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/